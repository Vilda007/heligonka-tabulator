<body>
<header>
  <nav id="topmenu" class="topmenu"></nav>
  <h1 data-i18n="lib.title">📚 Knihovna písní</h1>
  <p class="lead" data-i18n="lib.lead">Všechny písně všech uživatelů. Klikni na název pro otevření v tabulátoru, seřaď kliknutím na záhlaví.</p>
</header>
<main>
<section>
  <input id="lib-search" data-i18n-placeholder="lib.search" title="Hledá ve všech písních (název / autor / tónina)" placeholder="🔍 Hledat (název / autor / tónina)" style="width:100%;padding:.4em;margin:.5rem 0;">
  <label style="display:inline-flex;align-items:center;gap:.4rem;margin:.3rem 0;"><span data-i18n="lib.langf">Jazyk:</span>
    <select id="lib-lang-filter" title="Filtr písní podle jazyka">
      <option value="" data-i18n="lib.all">Všechny</option>
      <option value="CZ">🇨🇿 CZ</option>
      <option value="SK">🇸🇰 SK</option>
      <option value="UA">🇺🇦 UA</option>
      <option value="PL">🇵🇱 PL</option>
      <option value="GE">🇩🇪 GE</option>
      <option value="HU">🇭🇺 HU</option>
      <option value="RO">🇷🇴 RO</option>
      <option value="SI">🇸🇮 SI</option>
      <option value="EN">🇬🇧 EN</option>
      <option value="FR">🇫🇷 FR</option>
      <option value="SP">🇪🇸 SP</option>
      <option value="PT">🇵🇹 PT</option>
      <option value="NO">🇳🇴 NO</option>
      <option value="SE">🇸🇪 SE</option>
      <option value="FI">🇫🇮 FI</option>
      <option value="IT">🇮🇹 IT</option>
    </select>
  </label>
  <label id="mine-wrap" style="display:inline-flex;align-items:center;gap:.4rem;margin:.3rem .6rem;cursor:pointer">
    <input type="checkbox" id="lib-mine-filter" style="vertical-align:middle"> <span data-i18n="lib.mine">Jen moje</span>
  </label>
  <div id="library-error" class="hint" style="color:#a33;"></div>
  <table class="libtable">
    <thead id="lib-thead"></thead>
    <tbody id="library-rows"></tbody>
  </table>
  <div id="lib-pager"></div>
  <div class="controls" style="margin-top:.6rem;">
    <button id="new-song" title="Založí novou píseň (dotaz na název) a otevře ji v Tabulátoru" data-i18n="lib.new">➕ Nová píseň</button>
  </div>
  <div class="hint" data-i18n="lib.ratehint">Hodnocení: klikni na hvězdičky v detailu písně (přihlášení uživatelé). Kopírování k sobě (📄) může editor.</div>
</section>
</main>
<footer>Heligonka Tabulator — <a href="https://github.com/Vilda007/heligonka-tabulator">GitHub</a></footer>
<script src="shared.js"></script>
<script src="i18n.js"></script>
<script src="library.js"></script>
</body>
</html>
