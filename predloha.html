<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prázdná tisková předloha — Heligonka Tabulator</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Prázdná tisková předloha tabulatury pro heligonku — vytiskni si prázdné řádky (II./I./B/M/text) pro ruční zápis hmatů.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#7a4a1d">
<link rel="stylesheet" href="style.css?v=2026100706">
<style>
  .predloha-ctrl { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
  .predloha-ctrl label { font-size: .9rem; }
  #print-note { color: #7a4a1d; font-size: .85rem; margin: .3rem 0 1rem; }
  .sheet-inner.predloha { min-width: 0; width: 210mm; min-height: 297mm; padding: 15mm 12mm; margin: 0 auto; background: #fffdf5; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  @page { size: A4 portrait; margin: 0; }
  .predloha-title { text-align: center; font-size: 1.3rem; margin: 0 0 .6em; }
  .print-footer { text-align: center; font-size: .75rem; color: #999; margin-top: 1.2rem; }
  @media print {
    #editor-controls, header, footer, .topmenu, .predloha-ctrl, #print-note { display: none !important; }
    body { background: #fff; padding: 0; }
    .sheet-inner.predloha { border: 0; box-shadow: none; background: #fff; width: 210mm; min-height: 296mm; padding: 15mm 12mm; }
    .system { break-inside: avoid; }
  }
</style>
<script>window.__GA_IDS=["G-04KFHFT8V8"];</script>
<script src="/consent.js" defer></script>
</head>
<body>
<header>
  <nav id="topmenu" class="topmenu"></nav>
  <h1 data-i18n="pred.title">🖨️ Prázdná tisková předloha</h1>
  <p class="lead" data-i18n="pred.lead">Prázdná tabulatura pro ruční zápis hmatů — vytiskni si (nebo ulož jako PDF) a piš na papír jako do notáčku.</p>
</header>
<main>
<section>
  <div id="editor-controls" class="predloha-ctrl">
    <label><span data-i18n="pred.rows">Počet řádků (systémů):</span>
      <input type="number" id="rows-count" min="1" max="24" value="8" style="width:4em">
    </label>
    <label><span data-i18n="pred.cols">Sloupců na řádek:</span>
      <input type="number" id="cols-count" min="4" max="20" value="15" style="width:4em">
    </label>
    <label><span data-i18n="pred.songname">Název písně:</span>
      <input type="text" id="song-name" data-i18n-placeholder="pred.empty" placeholder="(prázdné)" style="width:14em">
    </label>
    <label><span data-i18n="tab.key">Tónina:</span>
      <select id="song-key">
        <option value="" data-i18n="pred.empty">(prázdné)</option>
        <option value="F">F dur</option>
        <option value="C">C dur</option>
        <option value="G">G dur</option>
        <option value="A">A dur</option>
        <option value="D">D dur</option>
        <option value="Bb">B dur</option>
      </select>
    </label>
    <button onclick="buildPredloha()" title="Přegeneruje předlohu dle zadaných hodnot" data-i18n="pred.gen">Vygenerovat</button>
    <button onclick="window.print()" title="Otevře tisk — v dialogu lze zvolit Uložit jako PDF" data-i18n="pred.printbtn">🖨️ Tisk / PDF</button>
  </div>
  <div id="print-note" data-i18n="pred.tip">Tip: v tiskovém dialogu zvol „Uložit jako PDF" pro elektronickou verzi. Doporučeno A4 na výšku.</div>
  <div id="output" class="sheet"></div>
</section>
</main>
<footer>Heligonka Tabulator — <a href="index.html">Zpět do aplikace</a></footer>
<script src="shared.js?v=20261007"></script>
<script src="i18n.js?v=20261007"></script>
<script>
function buildPredloha() {
  const rows = Math.max(1, Math.min(24, +document.getElementById('rows-count').value || 8));
  const cols = Math.max(4, Math.min(16, +document.getElementById('cols-count').value || 8));
  const out = document.getElementById('output');
  out.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'sheet-inner predloha';
  const head = document.createElement('div');
  const nm = (document.getElementById('song-name').value || '').trim();
  const ky = (document.getElementById('song-key').value || '').trim();
  const nmHtml = nm ? esc(nm) : '&nbsp;';
  const kyHtml = ky ? ' <span style="font-weight:normal">(' + esc(ky + ' dur') + ')</span>' : '';
  head.innerHTML = '<div class="predloha-title">' + (nm ? '<b>' + nmHtml + '</b>' + kyHtml : '&nbsp;') + '</div>';
  wrap.appendChild(head);
  for (let r = 0; r < rows; r++) {
    const sys = document.createElement('div'); sys.className = 'system';
    const labs = document.createElement('div'); labs.className = 'labs';
    labs.innerHTML = '<div class="lab">II.</div><div class="lab">I.</div><div class="lab">B</div><div class="lab">M</div><div class="lab"></div>';
    sys.appendChild(labs);
    const cells = document.createElement('div'); cells.className = 'cells';
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div'); cell.className = 'cell';
      for (let i = 0; i < 5; i++) cell.appendChild(document.createElement('div'));
      cells.appendChild(cell);
    }
    sys.appendChild(cells);
    wrap.appendChild(sys);
  }
  out.appendChild(wrap);
  /* patička tisku */
  const foot = document.createElement('div');
  foot.className = 'print-footer';
  foot.textContent = '\u{1F99E} Klepeto & Heligonka - https://klepeto.kuzelovi.cz/heligonka/';
  wrap.appendChild(foot);
}
window.addEventListener('DOMContentLoaded', buildPredloha);
</script>
</body>
</html>
